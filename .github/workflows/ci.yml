name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate built-in profiles
        run: python3 scripts/validate_builtin_profiles.py
      - name: Run end-to-end self check
        run: python3 scripts/self_check.py